name: Conferir e publicar

# Publica a Edge Function quando algo muda nela na branch principal.
# A conferencia vem antes do deploy de proposito: se o painel nao compilar,
# nada e publicado e a versao no ar continua intacta.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'scripts/conferir-painel.ts'
      - '.github/workflows/publicar.yml'
  pull_request:
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

# A referencia do projeto nao e segredo: ela aparece na URL publica do painel.
# O unico segredo e o SUPABASE_ACCESS_TOKEN, cadastrado em Settings > Secrets.
env:
  PROJETO: ryxaqocbihbecwwzyqis
  FUNCAO: comenta

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Conferir o TypeScript do servidor
        run: deno check supabase/functions/${{ env.FUNCAO }}/index.ts

      - name: Conferir o JavaScript do painel
        run: deno run --allow-read scripts/conferir-painel.ts supabase/functions/${{ env.FUNCAO }}/index.ts

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # So publica em push na main. Pull request passa pelas conferencias e
      # para por ai, que e o ponto de poder revisar antes de ir ao ar.
      - name: Publicar
        if: github.event_name != 'pull_request'
        run: |
          supabase functions deploy "$FUNCAO" \
            --project-ref "$PROJETO" \
            --no-verify-jwt \
            --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # O webhook nao pode exigir JWT: quem chama e a Meta, sem sessao. Por
      # isso o --no-verify-jwt acima. A protecao do webhook e a assinatura
      # HMAC conferida dentro da propria funcao.
      - name: Conferir se o sistema respondeu
        if: github.event_name != 'pull_request'
        run: |
          sleep 5
          curl -fsS https://comenta-e-recebe.comunicacao-b28.workers.dev/saude
          echo
